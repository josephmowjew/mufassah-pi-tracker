openapi: 3.0.3
info:
  title: 'Mufasah Device Tracking API'
  description: 'API for the Mufasah Device Tracking System - A comprehensive platform for tracking and protecting electronic devices with IoT integration, geofencing, theft reporting, and subscription management.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Authentication
    description: "\nAPIs for user authentication - registration, login, logout, and token management."
  -
    name: 'User Profile'
    description: "\nAPIs for user profile management - view and update profile, change password."
  -
    name: Devices
    description: "\nAPIs for managing tracked devices - registration, updates, ownership, and IoT module linking."
  -
    name: 'Device Locations'
    description: "\nAPIs for device location tracking - history, latest location, analytics, and manual entry."
  -
    name: Geofences
    description: "\nAPIs for geofencing - create virtual boundaries with entry/exit alerts for tracked devices."
  -
    name: 'Theft Reports'
    description: "\nAPIs for theft reporting - report stolen devices, track recovery, and manage status."
  -
    name: Subscriptions
    description: "\nAPIs for subscription management - view, cancel, and reactivate subscriptions."
  -
    name: 'Subscription Plans'
    description: "\nAPIs for subscription plans - browse available plans and pricing."
  -
    name: Payments
    description: "\nAPIs for payment processing - initiate payments and view payment history."
  -
    name: Warranties
    description: "\nAPIs for warranty management - register warranties and view warranty details."
  -
    name: 'Warranty Claims'
    description: "\nAPIs for warranty claims - submit and track warranty claims."
  -
    name: Notifications
    description: "\nAPIs for notification management - view, mark as read, and manage preferences."
  -
    name: 'IoT Modules'
    description: "\nAPIs for IoT module management - register and configure tracking hardware."
  -
    name: 'Device Categories'
    description: "\nAPIs for device categories - browse available device types."
  -
    name: 'Admin Dashboard'
    description: "\nAPIs for admin dashboard - overview statistics and detailed metrics."
  -
    name: 'Admin User Management'
    description: "\nAPIs for managing users - create, update, suspend, and assign roles."
  -
    name: 'Admin Reports'
    description: "\nAPIs for generating detailed reports - theft, revenue, devices, subscriptions, and users."
  -
    name: 'Email Verification'
    description: "\nAPIs for email verification - resend verification email and verify email address."
  -
    name: 'IoT Location Updates'
    description: "\nAPIs for IoT devices to send location updates and heartbeats.\nAuthentication uses module_id:api_token instead of user Bearer tokens."
  -
    name: 'Other Endpoints'
    description: ''
  -
    name: 'Password Reset'
    description: "\nAPIs for password reset functionality - request reset link and reset password."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: "    To authenticate, include the Bearer token in the Authorization header:\n    ```\n    Authorization: Bearer {YOUR_AUTH_TOKEN}\n    ```\n\n    Get your token by:\n    1. Register via `POST /api/v1/auth/register`\n    2. Or login via `POST /api/v1/auth/login`\n\n    The token is returned in the `data.token` field of the response."
security:
  -
    default: []
paths:
  /api/v1/auth/register:
    post:
      summary: 'Register a new user.'
      operationId: registerANewUser
      description: 'Create a new user account and receive an authentication token.'
      parameters: []
      responses:
        201:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Registration successful. Please check your email to verify your account.'
                  data:
                    user:
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      roles:
                        - customer
                    token: 1|abc123...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Registration successful. Please check your email to verify your account.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: john@example.com
                          roles:
                            type: array
                            example:
                              - customer
                            items:
                              type: string
                      token:
                        type: string
                        example: 1|abc123...
        422:
          description: 'Validation Error'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation failed.'
                  errors:
                    email:
                      - 'The email has already been taken.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation failed.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                  nullable: false
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                  nullable: false
                phone_number:
                  type: string
                  description: 'Must match the regex /^(\+265|265|0)[0-9]{9}$/. Must not be greater than 20 characters.'
                  example: vdljnikhwaykcmyu
                  nullable: false
              required:
                - name
                - email
                - password
                - phone_number
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Login user and create token.'
      operationId: loginUserAndCreateToken
      description: 'Authenticate with email and password to receive an API token.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Login successful.'
                  data:
                    user:
                      id: 1
                      name: 'John Doe'
                      email: john@example.com
                      roles:
                        - customer
                    token: 2|xyz789...
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Login successful.'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'John Doe'
                          email:
                            type: string
                            example: john@example.com
                          roles:
                            type: array
                            example:
                              - customer
                            items:
                              type: string
                      token:
                        type: string
                        example: 2|xyz789...
        401:
          description: 'Invalid Credentials'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Invalid credentials. Please check your email and password.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Invalid credentials. Please check your email and password.'
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                  nullable: false
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                  nullable: false
              required:
                - email
                - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: 'Logout user (revoke current token).'
      operationId: logoutUserrevokeCurrentToken
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      summary: 'Refresh token (revoke current and issue new).'
      operationId: refreshTokenrevokeCurrentAndIssueNew
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Authentication
  /api/v1/user:
    get:
      summary: "Get the authenticated user's profile."
      operationId: getTheAuthenticatedUsersProfile
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unauthenticated. Please login to continue.'
      tags:
        - 'User Profile'
    put:
      summary: "Update the authenticated user's profile."
      operationId: updateTheAuthenticatedUsersProfile
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'User Profile'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                  nullable: false
                phone_number:
                  type: string
                  description: 'Must match the regex /^(\+265|265|0)[0-9]{9}$/. Must not be greater than 20 characters.'
                  example: ngzmiyvdljnikhwa
                  nullable: false
                address:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: 'y'
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: k
                  nullable: true
  /api/v1/user/password:
    put:
      summary: "Change the authenticated user's password."
      operationId: changeTheAuthenticatedUsersPassword
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'User Profile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: ''
                  example: architecto
                  nullable: false
                password:
                  type: string
                  description: 'The value and <code>current_password</code> must be different.'
                  example: '|]|{+-'
                  nullable: false
              required:
                - current_password
                - password
  /api/v1/user/avatar:
    post:
      summary: 'Upload avatar for the authenticated user.'
      operationId: uploadAvatarForTheAuthenticatedUser
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'User Profile'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: 'Must be an image. Must not be greater than 2048 kilobytes.'
                  nullable: false
              required:
                - avatar
    delete:
      summary: 'Delete avatar for the authenticated user.'
      operationId: deleteAvatarForTheAuthenticatedUser
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'User Profile'
  /api/v1/devices:
    get:
      summary: "List user's devices with optional filtering."
      operationId: listUsersDevicesWithOptionalFiltering
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unauthenticated. Please login to continue.'
      tags:
        - Devices
    post:
      summary: 'Register a new device.'
      operationId: registerANewDevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                serial_number:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: b
                  nullable: false
                category_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the device_categories table.'
                  example: 16
                  nullable: false
                brand:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                  nullable: false
                model:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                  nullable: false
                description:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: 'Quos velit et fugiat sunt nihil accusantium harum.'
                  nullable: true
                color:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: i
                  nullable: true
                purchase_date:
                  type: string
                  description: 'Must be a valid date. Must be a date before or equal to <code>today</code>.'
                  example: '2021-12-17'
                  nullable: true
                purchase_price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 39
                  nullable: true
                purchase_location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                notes:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: z
                  nullable: true
                photos:
                  type: array
                  description: 'Must be an image. Must not be greater than 2048 kilobytes.'
                  items:
                    type: string
                    format: binary
              required:
                - serial_number
                - category_id
                - brand
                - model
  '/api/v1/devices/{id}':
    get:
      summary: 'View a specific device.'
      operationId: viewASpecificDevice
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unauthenticated. Please login to continue.'
      tags:
        - Devices
    put:
      summary: 'Update a device.'
      operationId: updateADevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the device_categories table.'
                  example: 16
                  nullable: false
                brand:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: 'n'
                  nullable: false
                model:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: g
                  nullable: false
                description:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: 'Quos velit et fugiat sunt nihil accusantium harum.'
                  nullable: true
                color:
                  type: string
                  description: 'Must not be greater than 50 characters.'
                  example: i
                  nullable: true
                purchase_date:
                  type: string
                  description: 'Must be a valid date. Must be a date before or equal to <code>today</code>.'
                  example: '2021-12-17'
                  nullable: true
                purchase_price:
                  type: number
                  description: 'Must be at least 0.'
                  example: 39
                  nullable: true
                purchase_location:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                notes:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: z
                  nullable: true
    delete:
      summary: 'Delete a device.'
      operationId: deleteADevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/status':
    put:
      summary: 'Update device status.'
      operationId: updateDeviceStatus
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: ''
                  example: maintenance
                  nullable: false
                  enum:
                    - active
                    - stolen
                    - recovered
                    - inactive
                    - maintenance
                notes:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: b
                  nullable: true
              required:
                - status
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/photos':
    post:
      summary: 'Upload photos for a device.'
      operationId: uploadPhotosForADevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  description: 'Must be an image. Must not be greater than 2048 kilobytes.'
                  items:
                    type: string
                    format: binary
    delete:
      summary: 'Delete a photo from a device.'
      operationId: deleteAPhotoFromADevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_index:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 27
                  nullable: false
              required:
                - photo_index
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/transfer':
    post:
      summary: 'Transfer device ownership.'
      operationId: transferDeviceOwnership
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to_user_email:
                  type: string
                  description: 'Must be a valid email address. The <code>email</code> of an existing record in the users table.'
                  example: gbailey@example.net
                  nullable: false
                transfer_reason:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: m
                  nullable: false
                notes:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: i
                  nullable: true
              required:
                - to_user_email
                - transfer_reason
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/ownership-history':
    get:
      summary: 'Get device ownership history.'
      operationId: getDeviceOwnershipHistory
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unauthenticated. Please login to continue.'
      tags:
        - Devices
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/link-module':
    post:
      summary: 'Link IoT module to device.'
      operationId: linkIoTModuleToDevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                iot_module_id:
                  type: integer
                  description: 'The <code>id</code> of an existing record in the iot_modules table.'
                  example: 16
                  nullable: false
              required:
                - iot_module_id
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/unlink-module':
    delete:
      summary: 'Unlink IoT module from device.'
      operationId: unlinkIoTModuleFromDevice
      description: ''
      parameters: []
      responses: {  }
      tags:
        - Devices
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/locations':
    get:
      summary: 'Get location history for a device.'
      operationId: getLocationHistoryForADevice
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unauthenticated. Please login to continue.'
      tags:
        - 'Device Locations'
    post:
      summary: 'Store a manual location (user-provided).'
      operationId: storeAManualLocationuserProvided
      description: ''
      parameters: []
      responses: {  }
      tags:
        - 'Device Locations'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  description: 'Must be between -90 and 90.'
                  example: -89
                  nullable: false
                longitude:
                  type: number
                  description: 'Must be between -180 and 180.'
                  example: -179
                  nullable: false
                address:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: g
                  nullable: true
                notes:
                  type: string
                  description: 'Must not be greater than 500 characters.'
                  example: z
                  nullable: true
              required:
                - latitude
                - longitude
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/locations/latest':
    get:
      summary: 'Get the latest location for a device.'
      operationId: getTheLatestLocationForADevice
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unauthenticated. Please login to continue.'
      tags:
        - 'Device Locations'
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/locations/statistics':
    get:
      summary: 'Get location statistics for a device.'
      operationId: getLocationStatisticsForADevice
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Unauthenticated. Please login to continue.'
      tags:
        - 'Device Locations'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2025-11-23T17:28:01'
                  nullable: true
                to:
                  type: string
                  description: 'Must be a valid date. Must be a date after or equal to <code>from</code>.'
                  example: '2051-12-17'
                  nullable: true
    parameters:
      -
        in: path
        name: device_id
        description: 'The ID of the device.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/devices/{device_id}/locations/heatmap':
    get:
      summary: 'Get heatmap data for a device (location density).'
      operationId: getHeatmapDataForADevicelocationDensity
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Unauthenticated. Please login to continue.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
